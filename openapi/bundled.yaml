      in: path
      required: true
      description: Thread ID
      schema:
        type: string
        format: uuid
    MessageId:
      name: mid
      in: path
      required: true
      description: Message ID
      schema:
        type: string
        format: uuid
    RunId:
      name: rid
      in: path
      required: true
      description: Run ID
      schema:
        type: string
        format: uuid
    StepId:
      name: sid
      in: path
      required: true
      description: Run Step ID
      schema:
        type: string
        format: uuid
    AgentId:
      name: id
      in: path
      required: true
      description: Agent Type ID
      schema:
        type: string
        format: uuid
    ToolId:
      name: id
      in: path
      required: true
      description: Tool ID
      schema:
        type: string
        format: uuid
