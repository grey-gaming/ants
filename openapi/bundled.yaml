openapi: 3.1.0
info:
  title: ANTS API
  description: |
    Autonomous Networked Task System (ANTS) — API-first multi-agent orchestration.
    OpenAI-inspired but custom. All mutations accept Idempotency-Key header.
    All list endpoints use cursor-based pagination.
  version: 1.0.0
  contact:
    name: ANTS
    url: https://github.com/grey-gaming/ants
  license:
    name: MIT
servers:
  - url: http://localhost:3000/v1
    description: Local development
security:
  - BearerAuth: []
tags:
  - name: Threads
    description: Conversation containers
  - name: Messages
    description: Messages within threads
  - name: Runs
    description: Agent execution units
  - name: Run Steps
    description: Individual steps within a run
  - name: Activity
    description: Delegation tree observability
  - name: Agents
    description: Agent type registry
  - name: Tools
    description: Tool registry
  - name: Settings
    description: Key-value configuration
  - name: Auth
    description: Authentication and API key management
  - name: Health
    description: System health and queue status
  - name: Users
    description: User management
  - name: InviteCodes
    description: Invite code management
paths:
  /threads/{id}/activity:
    get:
      tags:
        - Activity
      operationId: getThreadActivity
      summary: Full activity trace for a thread (delegation tree)
      description: |
        Returns the complete Run tree with parent_run_id relationships,
        which agent called which, tool calls, and results.
        Convenience endpoint that builds the delegation tree so you can
        investigate any chat session.
      parameters:
        - name: id
          in: path
          required: true
          description: Thread ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Activity trace with delegation tree
          content:
            application/json:
              schema:
                type: object
                required:
                  - thread_id
                  - runs
                description: |
                  The complete delegation tree for a thread. Runs are nested
                  via parent_run_id with steps embedded directly in each run
                  for a self-contained tree — no client-side cross-referencing needed.
                properties:
                  thread_id:
                    type: string
                    format: uuid
                  runs:
                    type: array
                    items:
                      type: object
                      description: A run within the activity trace, with embedded steps and sub-run nesting
                      required:
                        - id
                        - agent_type_id
                        - status
                        - created_at
                      properties:
                        id:
                          type: string
                          format: uuid
                        agent_type_id:
                          type: string
                          format: uuid
                        agent_name:
                          type: string
                          description: Agent type name for convenience
                        agent_tier:
                          type: string
                          enum:
                            - T1
                            - T2
                            - T3
                        parent_run_id:
                          type: string
                          format: uuid
                          nullable: true
                        status:
                          type: string
                          enum:
                            - queued
                            - in_progress
                            - awaiting_response
                            - paused
                            - completed
                            - failed
                            - cancelled
                        started_at:
                          type: string
                          format: date-time
                          nullable: true
                        completed_at:
                          type: string
                          format: date-time
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                        steps:
                          type: array
                          items:
                            type: object
                            required:
                              - id
                              - run_id
                              - type
                              - status
                              - created_at
                            properties:
                              id:
                                type: string
                                format: uuid
                              run_id:
                                type: string
                                format: uuid
                              type:
                                type: string
                                enum:
                                  - message_creation
                                  - tool_call
                                  - agent_delegation
                                  - reasoning
                              status:
                                type: string
                                enum:
                                  - pending
                                  - validating
                                  - executing
                                  - completed
                                  - failed
                                  - timed_out
                              details:
                                type: object
                                additionalProperties: true
                                nullable: true
                                description: Type-specific details (message, tool call, delegation target, etc.)
                              tool_call:
                                allOf:
                                  - type: object
                                    required:
                                      - id
                                      - name
                                      - arguments
                                      - status
                                    properties:
                                      id:
                                        type: string
                                        format: uuid
                                      tool_id:
                                        type: string
                                        format: uuid
                                        nullable: true
                                      name:
                                        type: string
                                      arguments:
                                        type: object
                                        additionalProperties: true
                                      result:
                                        type: object
                                        additionalProperties: true
                                        description: Tool execution result
                                        nullable: true
                                      status:
                                        type: string
                                        enum:
                                          - pending
                                          - validating
                                          - executing
                                          - completed
                                          - failed
                                          - timed_out
                                      created_at:
                                        type: string
                                        format: date-time
                                      completed_at:
                                        type: string
                                        format: date-time
                                        nullable: true
                                nullable: true
                                description: Tool call details (null for message_creation and reasoning steps)
                              tool_version:
                                type: string
                                nullable: true
                                description: Version of the tool used in this step. Nullable for steps that are not tool calls.
                              created_at:
                                type: string
                                format: date-time
                              completed_at:
                                type: string
                                format: date-time
                                nullable: true
                          description: Steps belonging to this run (embedded for convenience)
                        sub_run_ids:
                          type: array
                          items:
                            type: string
                            format: uuid
                          description: IDs of child runs delegated by this run
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
  /agents:
    post:
      tags:
        - Agents
      operationId: createAgent
      summary: Register an agent type
      parameters:
        - name: Idempotency-Key
          in: header
          description: Unique key to prevent duplicate mutations
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - tier
              properties:
                name:
                  type: string
                tier:
                  type: string
                  enum:
                    - T1
                    - T2
                    - T3
                description:
                  type: string
                  nullable: true
                can_delegate:
                  type: boolean
                  default: false
                model_config:
                  type: object
                  additionalProperties: true
                  nullable: true
                context_budget:
                  type: integer
                  default: 24000
                  description: Token budget for input context (32K window minus ~8K response reserve)
                capabilities:
                  type: object
                  additionalProperties: true
                  nullable: true
                tool_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  default: []
      responses:
        "201":
          description: Agent type registered
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - tier
                  - active
                  - created_at
                  - updated_at
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  tier:
                    type: string
                    enum:
                      - T1
                      - T2
                      - T3
                  description:
                    type: string
                    nullable: true
                  can_delegate:
                    type: boolean
                    default: false
                  model_config:
                    type: object
                    additionalProperties: true
                    nullable: true
                  context_budget:
                    type: integer
                    default: 24000
                    description: Token budget for input context (32K window minus ~8K response reserve)
                  capabilities:
                    type: object
                    additionalProperties: true
                    nullable: true
                  tool_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                    description: IDs of tools assigned to this agent type
                  active:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
    get:
      tags:
        - Agents
      operationId: listAgents
      summary: List agent types
      parameters:
        - name: after
          in: query
          description: Cursor for forward pagination
          schema:
            type: string
        - name: before
          in: query
          description: Cursor for backward pagination
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum items to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: List of agent types
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - tier
                        - active
                        - created_at
                        - updated_at
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        tier:
                          type: string
                          enum:
                            - T1
                            - T2
                            - T3
                        description:
                          type: string
                          nullable: true
                        can_delegate:
                          type: boolean
                          default: false
                        model_config:
                          type: object
                          additionalProperties: true
                          nullable: true
                        context_budget:
                          type: integer
                          default: 24000
                          description: Token budget for input context (32K window minus ~8K response reserve)
                        capabilities:
                          type: object
                          additionalProperties: true
                          nullable: true
                        tool_ids:
                          type: array
                          items:
                            type: string
                            format: uuid
                          description: IDs of tools assigned to this agent type
                        active:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                  pagination:
                    type: object
                    properties:
                      after:
                        type: string
                        nullable: true
                        description: Cursor for next page
                      before:
                        type: string
                        nullable: true
                        description: Cursor for previous page
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
  /agents/{id}:
    get:
      tags:
        - Agents
      operationId: getAgent
      summary: Get agent type detail (includes assigned tools)
      parameters:
        - name: id
          in: path
          required: true
          description: Agent Type ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Agent type details with assigned tools
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - tier
                  - active
                  - created_at
                  - updated_at
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  tier:
                    type: string
                    enum:
                      - T1
                      - T2
                      - T3
                  description:
                    type: string
                    nullable: true
                  can_delegate:
                    type: boolean
                    default: false
                  model_config:
                    type: object
                    additionalProperties: true
                    nullable: true
                  context_budget:
                    type: integer
                    default: 24000
                    description: Token budget for input context (32K window minus ~8K response reserve)
                  capabilities:
                    type: object
                    additionalProperties: true
                    nullable: true
                  tool_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                    description: IDs of tools assigned to this agent type
                  active:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
    patch:
      tags:
        - Agents
      operationId: updateAgent
      summary: Update agent type (including tool_ids for tool assignment)
      parameters:
        - name: id
          in: path
          required: true
          description: Agent Type ID
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Unique key to prevent duplicate mutations
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
                can_delegate:
                  type: boolean
                  nullable: true
                model_config:
                  type: object
                  additionalProperties: true
                  nullable: true
                context_budget:
                  type: integer
                  nullable: true
                  description: Token budget for input context (32K window minus ~8K response reserve)
                capabilities:
                  type: object
                  additionalProperties: true
                  nullable: true
                tool_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Replace the full set of assigned tool IDs
                  nullable: true
      responses:
        "200":
          description: Agent type updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - tier
                  - active
                  - created_at
                  - updated_at
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  tier:
                    type: string
                    enum:
                      - T1
                      - T2
                      - T3
                  description:
                    type: string
                    nullable: true
                  can_delegate:
                    type: boolean
                    default: false
                  model_config:
                    type: object
                    additionalProperties: true
                    nullable: true
                  context_budget:
                    type: integer
                    default: 24000
                    description: Token budget for input context (32K window minus ~8K response reserve)
                  capabilities:
                    type: object
                    additionalProperties: true
                    nullable: true
                  tool_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                    description: IDs of tools assigned to this agent type
                  active:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
    delete:
      tags:
        - Agents
      operationId: deactivateAgent
      summary: Deactivate an agent type
      parameters:
        - name: id
          in: path
          required: true
          description: Agent Type ID
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Agent type deactivated
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
  /api-keys:
    post:
      tags:
        - Auth
      operationId: createApiKey
      summary: Create an API key
      description: |
        Requires authentication. The first API key for a new installation must be
        bootstrapped via the ANTS_BOOTSTRAP_KEY environment variable — this endpoint
        cannot be used until at least one authenticated key exists.
        Users can only create API keys for themselves. The user_id is derived from
        the authenticated user's token.
      parameters:
        - name: Idempotency-Key
          in: header
          description: Unique key to prevent duplicate mutations
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        "201":
          description: API key created (full key returned only once)
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - key
                  - created_at
                description: Returned only once at creation — the key field contains the full secret
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  key:
                    type: string
                    description: Full API key (sk-...) — shown only once
                  created_at:
                    type: string
                    format: date-time
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
    get:
      tags:
        - Auth
      operationId: listApiKeys
      summary: List API keys
      responses:
        "200":
          description: List of API keys (keys are masked)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - created_at
                        - last_used_at
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        last_used_at:
                          type: string
                          format: date-time
                          nullable: true
                        expires_at:
                          type: string
                          format: date-time
                          nullable: true
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
  /api-keys/{id}:
    delete:
      tags:
        - Auth
      operationId: revokeApiKey
      summary: Revoke an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: API key revoked
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        description: Machine-readable error code
                      message:
                        type: string
                        description: Human-readable error message
                      details:
                        type: object
                        additionalProperties: true
                        description: Additional error context
  /auth/register:
    post:
      tags:
        - Auth
      operationId: registerUser
      summary: Register a new user
      description: |
        Invite-only registration. Requires a valid invite code.
        Returns a JWT token and user object on success.
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: Unique key to prevent duplicate mutations
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
