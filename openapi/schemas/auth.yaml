RegisterRequest:
  type: object
  required: [email, password, name]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      minLength: 6
    name:
      type: string
    invite_code:
      type: string
      description: Optional invite code — required only if invite-only mode is enabled

LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password

AuthResponse:
  type: object
  required: [user]
  properties:
    user:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
