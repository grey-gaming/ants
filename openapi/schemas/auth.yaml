ApiKey:
  type: object
  required: [id, name, created_at, last_used_at]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    created_at:
      type: string
      format: date-time
    last_used_at:
      type: string
      format: date-time
      nullable: true
    expires_at:
      type: string
      format: date-time
      nullable: true

ApiKeyWithSecret:
  type: object
  required: [id, name, key, created_at]
  description: Returned only once at creation — the key field contains the full secret
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    key:
      type: string
      description: Full API key (sk-...) — shown only once
    created_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time
      nullable: true

ApiKeyCreate:
  type: object
  required: [name]
  properties:
    name:
      type: string
    expires_at:
      type: string
      format: date-time
      nullable: true

ApiKeyListResponse:
  type: object
  required: [data]
  properties:
    data:
      type: array
      items:
        $ref: 'auth.yaml#/ApiKey'

RegisterRequest:
  type: object
  required: [email, password, name, invite_code]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      minLength: 8
    name:
      type: string
    invite_code:
      type: string
      description: Valid invite code required for registration

LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password

AuthResponse:
  type: object
  required: [token, user]
  properties:
    token:
      type: string
      description: JWT token for authentication
    user:
      $ref: 'user.yaml#/User'