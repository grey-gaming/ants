Tool:
  type: object
  required: [id, name, type, source, status, active, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    description:
      type: string
      nullable: true
    type:
      type: string
      enum: [function, builtin]
    source:
      type: string
      enum: [builtin, dynamic]
      description: "Origin of the tool. Built-in tools ship with ANTS, dynamic tools are created at runtime by agents."
    version:
      type: string
      description: "Semantic version of the tool. Built-in tools start at 1.0.0."
      default: "1.0.0"
    status:
      type: string
      enum: [draft, testing, approved, active, deprecated, disabled]
      description: "Lifecycle status of the tool. Built-in tools are active by default."
    required_permissions:
      type: array
      items:
        type: string
      description: "Permissions required by this tool. e.g. ['net:api.example.com', 'fs.read:/tmp']. Built-in tools have implicit full trust."
      default: []
    parameters_schema:
      description: JSON Schema defining tool parameters
      type: object
      additionalProperties: true
      nullable: true
    tool_timeout_seconds:
      type: integer
      default: 30
      description: Maximum execution time in seconds before the tool is timed out
    max_output_chars:
      type: integer
      default: 10000
      description: Maximum output size in characters; truncated results include a marker
    active:
      type: boolean
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

ToolCreate:
  type: object
  required: [name]
  properties:
    name:
      type: string
    description:
      type: string
      nullable: true
    type:
      type: string
      enum: [function, builtin]
      default: function
    source:
      type: string
      enum: [builtin, dynamic]
      default: builtin
      description: "Origin of the tool. Built-in tools ship with ANTS, dynamic tools are created at runtime by agents."
    version:
      type: string
      default: "1.0.0"
      description: "Semantic version of the tool. Built-in tools start at 1.0.0."
    status:
      type: string
      enum: [draft, testing, approved, active, deprecated, disabled]
      default: active
      description: "Lifecycle status of the tool. Built-in tools are active by default."
    required_permissions:
      type: array
      items:
        type: string
      default: []
      description: "Permissions required by this tool. e.g. ['net:api.example.com', 'fs.read:/tmp']. Built-in tools have implicit full trust."
    parameters_schema:
      type: object
      additionalProperties: true
      nullable: true
    tool_timeout_seconds:
      type: integer
      default: 30
      description: Maximum execution time in seconds before the tool is timed out
    max_output_chars:
      type: integer
      default: 10000
      description: Maximum output size in characters; truncated results include a marker

ToolUpdate:
  type: object
  properties:
    name:
      type: string
      nullable: true
    description:
      type: string
      nullable: true
    type:
      type: string
      enum: [function, builtin]
      nullable: true
    status:
      type: string
      enum: [draft, testing, approved, active, deprecated, disabled]
      nullable: true
      description: "Lifecycle status of the tool. Can change lifecycle status."
    parameters_schema:
      type: object
      additionalProperties: true
      nullable: true
    tool_timeout_seconds:
      type: integer
      nullable: true
      description: Maximum execution time in seconds before the tool is timed out
    max_output_chars:
      type: integer
      nullable: true
      description: Maximum output size in characters; truncated results include a marker

ToolListResponse:
  type: object
  required: [data, pagination]
  properties:
    data:
      type: array
      items:
        $ref: 'tool.yaml#/Tool'
    pagination:
      $ref: 'pagination.yaml#/Pagination'