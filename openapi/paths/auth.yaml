/auth/register:
  post:
    tags: [Auth]
    operationId: registerUser
    summary: Register a new user
    description: |
      Create a new user account. Invite code is optional — registration
      may be open or restricted depending on server configuration.
      On success an HTTP-only session cookie (ants_session) is set.
    security: []
    parameters:
      - $ref: '../parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/RegisterRequest'
    responses:
      '201':
        description: User registered successfully (session cookie set)
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/AuthResponse'
      '400':
        $ref: '../responses.yaml#/BadRequest'

/auth/login:
  post:
    tags: [Auth]
    operationId: loginUser
    summary: Authenticate and set session cookie
    description: Authenticate with email and password. On success an HTTP-only session cookie (ants_session) is set.
    security: []
    parameters:
      - $ref: '../parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth.yaml#/LoginRequest'
    responses:
      '200':
        description: Authentication successful (session cookie set)
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/AuthResponse'
      '401':
        $ref: '../responses.yaml#/Unauthorized'

/auth/logout:
  post:
    tags: [Auth]
    operationId: logoutUser
    summary: End the current session
    description: Clears the ants_session cookie and invalidates the session.
    responses:
      '204':
        description: Session ended

/auth/me:
  get:
    tags: [Auth]
    operationId: getCurrentUser
    summary: Get the authenticated user
    description: Returns the user object for the current session (ants_session cookie).
    responses:
      '200':
        description: Current user
        content:
          application/json:
            schema:
              $ref: '../schemas/auth.yaml#/AuthResponse'
      '401':
        $ref: '../responses.yaml#/Unauthorized'
