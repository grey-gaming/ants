# This is the root OpenAPI spec for ANTS.
# Paths, schemas, parameters, and responses are in separate domain files:
#   - openapi/paths/*.yaml    (Paths Objects)
#   - openapi/schemas/*.yaml  (Schema maps)
#   - openapi/parameters.yaml (Shared parameters)
#   - openapi/responses.yaml  (Shared responses)
#
# Use `bun run spec:bundle` to assemble the full spec into openapi/bundled.yaml.
# Use `bun run spec:validate` to validate the bundled spec.
# Use `bun run spec:types` to generate TypeScript types from the bundled spec.

openapi: 3.1.0
info:
  title: ANTS API
  description: |
    Autonomous Networked Task System (ANTS) — API-first multi-agent orchestration.
    OpenAI-inspired but custom. All mutations accept Idempotency-Key header.
    All list endpoints use cursor-based pagination.
  version: 1.0.0
  contact:
    name: ANTS
    url: https://github.com/grey-gaming/ants
  license:
    name: MIT

servers:
  - url: http://localhost:3000/v1
    description: Local development

security:
  []

tags:
  - name: Threads
    description: Conversation containers
  - name: Messages
    description: Messages within threads
  - name: Runs
    description: Agent execution units
  - name: Run Steps
    description: Individual steps within a run
  - name: Activity
    description: Delegation tree observability
  - name: Agents
    description: Agent type registry
  - name: Tools
    description: Tool registry
  - name: Settings
    description: Key-value configuration
  - name: Auth
    description: Authentication (login/logout/register)
  - name: Health
    description: System health and queue status
  - name: Users
    description: User management
  - name: InviteCodes
    description: Invite code management

paths: {}

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: ants_session
      description: HTTP-only session cookie set by POST /v1/auth/login

  parameters: {}
  responses: {}
  schemas: {}