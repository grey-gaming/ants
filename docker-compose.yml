services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ants-db
    environment:
      POSTGRES_USER: ants
      POSTGRES_PASSWORD: ants-dev-password
      POSTGRES_DB: ants
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ants -d ants"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
    driver: local
